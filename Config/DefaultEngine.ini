; 스모크 테스트(AnimGraphMcp.Smoke.AnimBlueprint)가 여는 AnimBP 경로 — 생략 시 /Game/Animation
+SmokeTestPaths=/Game/Animation
; AI 애니 생성 (Docs/AIAnimation) — 출력·임포트 경로의 유일한 기준. get_editor_status 가 내보낸다
; 생성 Tool(import · IK Rig · 리타기터 · 리타깃)은 이 경로 밖에 애셋을 만들거나 저장하지 않는다 (OUTPUT_PATH_NOT_ALLOWED · UNEXPECTED_DIRTY)
+GenerationOutputPaths=/Game/Animation/Generated/
+GenerationOutputPaths=/Game/Animation/Test/
; import_animation_file 이 읽을 수 있는 디스크 폴더 (프로젝트 기준 상대 경로 또는 절대 경로)
+ImportSourceRoots=Saved/AnimGen/Import/
; retarget_animations 한 번에 받는 애셋 수 상한 (입력 + 동반 참조). 2026-10-23 Phase 1 실측: 20개·1,317프레임을 리타깃·검증·저장까지 3.0초
; (애셋당 0.15초, 약 2.3ms/프레임). 50개면 애셋당 300프레임이어도 약 35초 — 프록시 타임아웃 180초의 1/5 안
MaxRetargetAssetsPerCall=50
; search_animations 수동 태그 파일 (JSON {"tags": {"<애셋 또는 폴더/>": [..]}}) — 애셋 메타데이터 대신 이 파일에 둔다 (Phase 2)
+AnimationTagFiles=Config/AnimGraphMcp/AnimationTags.json

