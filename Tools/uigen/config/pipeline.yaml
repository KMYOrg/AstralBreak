# UI 자동 생성 파이프라인 설정 (Docs/Design/ui-autogen-pipeline.md §2 · §3-2). 값은 전부 잠정.
# 저장소 안 경로는 저장소 루트 기준 상대, 엔진 · 사용자 도구는 절대 경로.
schema_version: 1
phase: 1b

paths:
  work_root: Tools/uigen/work            # run 별 산출물 — git 무시, Saved 밖(이미지를 Read · 전송할 수 있게)
  metrics: Tools/uigen/metrics/uigen.jsonl
  ue_run_root: /Game/_AutoGen            # run 애셋은 /Game/_AutoGen/<run_id>/ 에만 (WidgetOutputPaths)

codegen:                                 # §3-3 — C++ 생성 위치 · 모듈 (screens.yaml 의 feature · 클래스 이름과 합쳐 경로가 된다)
  module: AstralBreak                    # 클래스 경로 /Script/<module>.<Widget>
  api_macro: ASTRALBREAK_API
  module_root: Source/AstralBreak        # 저장소 기준 — 헤더 이름 중복 검사 범위
  ui_dir: UI                             # <module_root>/<ui_dir>/<feature>/ (+ AutoGen/) — 쓰기는 이 아래 두 곳뿐

editor:                                  # CLAUDE.md 에디터 주기 그대로 (1a-3 codegen 이 사용)
  exe: D:/UnrealSource/UnrealEngine-5.7.4-release/Engine/Binaries/Win64/UnrealEditor-Win64-DebugGame.exe
  project: D:/UE5Projects/AstralBreak/AstralBreak.uproject
  args: [-log, -unattended, -stdout, -FullStdOutLogOutput]   # 표준 출력은 work/<run_id>/codegen/editor.log
  bridge_wait_s: 540
  bridge_poll_s: 10
  settle_s: 30                           # 브리지 준비 뒤 더 기다림(자동 시험 CEF 크래시 함정)
  exit_wait_s: 180
  quit_discard_only_under: [/Game/_AutoGen/]

build:                                   # codegen 빌드 — 에디터를 내린 상태에서 실행 중 구성만
  bat: D:/UnrealSource/UnrealEngine-5.7.4-release/Engine/Build/BatchFiles/Build.bat
  target: AstralBreakEditor
  platform: Win64
  configuration: DebugGame
  args: [-WaitMutex, -NoHotReload]
  timeout_s: 1800

limits:
  retries: 3                             # 재시도 N (§12-2 6 — 11-14 사용자: 3 으로 시작)
  early_stop_no_progress: 2              # 두 번 연속 실패 게이트 집합이 줄지 않으면 조기 종료
  codex_calls_per_run: 20

backends:
  allowed: [procedural, codex]           # 1b-5 — codex 연결(gen/codex.py). comfy 는 Phase 5

codex:                                   # §7 — 공식 codex CLI · built-in image_gen 만 (gen/codex.py, 1b-2)
  cli: auto                              # auto = PATH 의 codex — npm .cmd 래퍼면 node + codex.js 로 직접(cmd.exe 가 프롬프트를 해석하지 않게) · 또는 [exe, …]
  expected_version: 0.166.0              # run 시작 때 `codex --version` 기록 — 다르면 표시만
  home: null                             # null = $CODEX_HOME 또는 ~/.codex — 결과 generated_images/<thread_id>/ 를 찾는 곳(auth.json 은 읽지 않는다)
  sandbox: workspace-write               # cwd = work/<run>/gen/<asset_id> (git 무시)
  timeout_s: 600                         # 벽시계 — 넘으면 프로세스 트리를 끝낸다(node → codex.exe)
  strip_env: [OPENAI_API_KEY, CODEX_API_KEY, AZURE_OPENAI_API_KEY]   # 유료 API 폴백 차단
  suspect_quota_after_failures: 2        # 식별자 없이 이미지가 안 나온 호출이 연속 N 번이면 한도로 추정(A3 '틀리면')

extract:                                 # 1b 후속 A — 컨셉에서 따오기(spec asset source_mode: extract · codex 편집). 값은 잠정
  pad: 8                                 # ref_bbox 바깥 여유(px) — 이 상자를 다시 되자른다
  max_aspect: 3.0                        # [실측 A-1] 편집 출력 캔버스 비율 = 입력 비율, 가장 긴 출력 3:1 — 더 긴 요소는 실제 화면으로 짧은 변을 넓힌다
  interior_alpha: 0.9                    # frame · panel_bg 안쪽 알파 — [실측 A-1] image_gen 은 안쪽을 거의 불투명(250 ~ 254)으로 낸다. null = 안쪽 단계 끔
  interior_flatten: true                 # 안쪽을 대표색 한 색으로 칠함 — [실측 A run] 글자 자리를 구멍(알파 6 ~ 19)으로 남긴 판이 나왔다. false = 알파 배수만
  interior_max_lightness: 35             # 대표색을 고를 픽셀의 L* 상한(금테 · 장식은 L* 60 이상)
  concept_pixels: true                   # 1b 후속 G — frame · panel_bg 에 컨셉 픽셀 옮겨 심기(gen/concept_pixels): codex 결과는 실루엣(알파)만, 색 · 모서리 장식 ·
                                         # 안쪽 빛은 컨셉 그대로(글자 자리는 줄 보간으로 메움 · 안쪽 알파 = interior_alpha). 게이지가 겹친 프레임 · 실루엣 IoU < 0.85 ·
                                         # 옮긴 뒤 OCR 자국이면 위 한 색 칠하기로 물러남. false = A 그대로
  fixed_size_draw_as: image              # 크기 고정 위젯(점 앵커 영역 안)의 따온 에셋 브러시 box → image — box 는 모서리를 텍스처 픽셀 × margin 으로 그려
                                         # 큰 텍스처면 모서리가 커지고 가운데가 눌린다(ElementBatcher.cpp:857-860, A run 2). box = 바꾸지 않음
  cutout: true                           # 1b 후속 H — extract 에셋은 컨셉 픽셀을 오려 쓴다(gen/cutout · refine._cut_entry): 알파 = ⓐ ⓑ reference_alpha ·
                                         # ⓒ GrabCut(codex 실루엣 시드), 색 = 컨셉, 가려진 자리 줄 보간. 위 interior_flatten · concept_pixels · IoU 물러남은
                                         # 이 길에서 쓰지 않는다(false = G 그대로). ⓐ ⓑ 와 작은 요소는 codex 를 부르지 않는다(generate.cut_only_reason)
  cutout_small_px: 64                    # ⓒ 에서 짧은 변이 이보다 작은 요소는 codex 없이 오린다([실측 G2] 54 px 방패 배지 — codex 입력을 17 배로 키워 흐림)
  overhang: true                         # 실루엣이 위젯 상자 밖(다른 그리는 위젯 자리 아님)으로 이어지면 텍스처 상자를 넓히고 캔버스 직속 장식 Image 로 그린다
                                         # (사용자 결정 (가') 11-16 — 크기 고정 · 런타임에 안 접히는 위젯만)
  notext: true                           # 글자 없는 판(inputs concept_notext — make_concept --text-free)이 있으면 글자 구멍만 그 픽셀로(gen/cutout.compose fill_from —
                                         # 요소마다 ±6 px 재정합, 둘레 차 > 24 이면 줄 보간으로 물러남). false = 판이 있어도 줄 보간

concept_convert:                         # 1b 후속 I — 컨셉을 codex 편집으로 'UI 만 · 진짜 알파' 컨셉 + 글자 없는 판으로 바꿔 ⓐ 로 잇는다(gen/concept_convert,
                                         # normalize). 합성 스크린샷(ⓒ)은 장면 · 반투명 UI 를 결정적으로 못 가르고(H) 검정 배경(ⓑ)은 어둡고 반투명을 못 가른다(H3)
  default: auto                          # inputs concept_convert 가 없을 때 — auto = ⓒ 만 · force = ⓑ 도 · off = 예전 경로(사용자 결정 11-17)
  max_calls: 2                           # 변환 codex 호출 상한(run 당 — 컨셉 · 글자 없는 판, run 전체 상한 limits.codex_calls_per_run 안에서도 셈)
  aspect_tol: 0.03                       # 변환 결과 비율이 원본과 이만큼 넘게 다르면 버림(구도 유지 실패)
  transparent_ratio: [0.05, 0.95]        # 변환 결과 투명 픽셀 비율이 이 밖이면 버림(배경이 안 빠졌거나 다 지워짐)
  text_free: true                        # 글자 없는 판도 받는다(실패해도 ⓐ 로 가되 판 없이)
  cache_dir: _convert                    # work_root 아래 — <원본 sha256 앞 16>_<프롬프트 sha256 앞 8>/ (다시 돌리면 codex 0, 지우면 다시 받음)

textures:                                # §12-2 5 — 11-14 사용자: EditorIcon 기본 + 큰 배경만 BC7
  compression_default: TC_EditorIcon
  compression_by_kind:
    panel_bg: TC_BC7
  lod_group: TEXTUREGROUP_UI
  mip_gen: TMGS_NoMipmaps
  never_stream: true
  srgb: true

render:
  resolutions: [[1920, 1080], [2560, 1080], [1920, 1200]]   # 화면 밖 게이트 — 기준 + 21:9 + 16:10

fonts:                                   # 프로젝트 폰트 (1b-3 — 11-15 사용자 승인: Pretendard v1.3.9 OFL, import_font_family 로 임포트 · 저장)
  default_family: /Game/UI/Fonts/Pretendard/F_Pretendard.F_Pretendard   # = 역할 body. spec font.family 값 — export 가 돌려주는 객체 경로 그대로(왕복 비교)
  typefaces: [Regular, Bold]             # spec font.weight regular · bold 만 그 타입페이스를 고른다(light · italic 은 첫 항목으로 대체)
  line_height:                           # body(Pretendard) — [실측 1b-3 · 1b 후속 D] TextBlock auto_size 높이(px, scale 1) — regular · bold 같음. 엔진 기본은 크기 × 약 1.6
    16: 26
    18: 30
    22: 36
    26: 43
    30: 49
    34: 55
    44: 71
    56: 90
    80: 129
  glyph_height: { hangul: 1.17, digits: 0.94 }   # 1b 후속 F — 보이는 글자 높이 / 크기 [실측 C1 렌더 '오의 불가' 35/30 · D 숫자 0.94] — analyze 프롬프트가 크기를 고를 때
  roles:                                 # 1b 후속 D — analyze 가 TextBlock 마다 font.role 을 고르고 apply_contract 가 family 로 바꾼다(body = 위 default_family)
    title:                               # 제목 · 배너 · 큰 숫자 — Noto Serif KR(notofonts/noto-cjk SubsetOTF KR, OFL — 11-15 사용자 승인)
      family: /Game/UI/Fonts/NotoSerifKR/F_NotoSerifKR.F_NotoSerifKR
      line_height: { 16: 31, 18: 35, 22: 43, 26: 51, 30: 58, 34: 66, 44: 86, 56: 109, 80: 155 }   # [실측 D] 크기 × 약 1.94, regular · bold 같음
      glyph_height: { hangul: 1.33, digits: 1.02 }   # 1b 후속 F [실측 C1 렌더] 배너 58/44 · 체인 35/26 · '4.2' 65/64 · '3' 62/61
      sdf_family: /Game/UI/Fonts/NotoSerifKR/F_NotoSerifKR_SDF.F_NotoSerifKR_SDF   # 1b 후속 F — 같은 OTF 의 거리장 사본(import_font_family distance_field) — 글자 빛 쓰는 글자만

text_fill:                               # 1b 후속 D — 글자색 · 세로 그라데이션을 컨셉에서 결정적으로(analyze.derive_text_fills). false = LLM 색 그대로
  enabled: true

text_glow:                               # 1b 후속 F — 글자 둘레 번지는 빛을 컨셉에서 결정적으로(analyze.derive_text_glow → font.glow + 그 역할의 sdf_family)
  enabled: true
  min_excess: 8                          # 획 2 ~ 6 px 밖 밝기가 바탕보다 L 이만큼 밝으면 빛(잠정 — [실측 F] '4.2' 15.5, 빛 없는 글자 ≤ 0)

gauge_fill:                              # 1b 후속 F — 따온 프레임 위 가로 게이지 채움(analyze.derive_gauge_fills · gen/concept_fill.py)
  mode: shape                            # shape = 컨셉 채움 모양 그대로(왼쪽 끝 · 밝은 테두리 · 트랙 띠 빛) · stops = B 의 줄마다 색만(gradient_bar)
  end: scale                             # scale = 진행 끝 테두리 · 번짐까지(ProgressBar bar_fill_style scale + 채움 box) · mask = 진행률에서 자름(엔진 기본)

style_review:                            # 1b 후속 C — 게이트 통과 뒤 외형 검토 라운드(stages/style.py). 합격 판정은 게이트만, 라운드 뒤 게이트가 깨지면 그 라운드를 버린다
  rounds: 1                              # 0 = 끔. concept 모드(reference.png 있음) · fix.mode ≠ deterministic 일 때만 돈다
  max_ops: 16                            # 라운드 patch 의 op 상한
  max_replace_per_round: 1               # replace_asset(codex 다시 편집 · 생성) — run 의 codex 상한(limits.codex_calls_per_run) 안, 한 번에 하나
  replace_guard_tol: 0.02                # 1b 후속 G — 다시 따온 에셋의 충실도(실루엣 IoU · 장식선 F1 · 모서리 F1 최소)가 라운드 전보다 이만큼 넘게 낮으면 그 에셋만 옛 것으로
                                         # [실측 F run 4] 배너 다시 따오기 F1 0.983 → 0.914 를 받아 금테가 노래졌다
  text_fit: true                         # 1b 후속 G — 외형 라운드 뒤 글자 결정적 맞춤(style.text_fit — LLM 없음), 두 판: 크기 판(높이 비로 크기 · 굵기, 형제 겹침 예측으로 상한)
                                         # → 위치 판(자간 · 중심), 판마다 build → verify 1회 · 깨지면 그 판만 버림.
                                         # 라운드가 꺼진 deterministic 모드에서도 돈다(컨셉이 있을 때)

fix:
  mode: hybrid                          # 1b-6 — 결정적 fixer 먼저, op 가 없거나 직전 결정적 patch 가 진전이 없으면 LLM verifier → fix (11-15 사용자 결정).
                                         # deterministic(1a) · llm 도 된다 — run 마다 --fix-mode 로 덮을 수 있다

llm:                                     # §10-1 claude -p 호출 틀(core/llm.py) — 1a 는 fix.mode deterministic 이라 호출 0, 1b 에서 값 보정
  cli: [claude]                          # 독립 실행 claude(~/.local/bin) — 데스크톱 앱과 따로 로그인(구독 계정)
  expected_version: 2.1.325              # 자동 업데이트로 바뀐다 — run 시작 때 기록(1b)
  cwd: Tools/uigen/claude_ctx            # 저장소 루트 설정에 기대지 않고 --settings · --allowedTools 로 명시
  settings: Tools/uigen/claude_ctx/.claude/settings.json
  mcp_config: Tools/uigen/config/empty_mcp.json
  stages:                                # 출력은 --json-schema(structured_output)로만 — 쓰기 도구 없음, Bash 금지
    # analyze — 11-15 사용자 결정(잠정 1.0 USD · 턴 6 · 600초). [실측 1b-1] 예산은 턴 사이 검사라 '한 턴 더' 여유 포함, model null = 사용자 기본(claude-opus-5-5)
    analyze:  { max_budget_usd: 1.0, max_turns: 6, timeout_s: 600, allowed_tools: [Read], prompt_file: Tools/uigen/prompts/analyze.md, model: null }
    verifier: { max_budget_usd: 0.5, max_turns: 8, timeout_s: 300, allowed_tools: [Read], prompt_file: Tools/uigen/prompts/verifier.md, model: null }
    fix:      { max_budget_usd: 0.5, max_turns: 6, timeout_s: 300, allowed_tools: [Read], prompt_file: Tools/uigen/prompts/fix.md, model: null }
    # 1b 후속 C — 외형 라운드(잠정). verifier 는 영역 나란히 그림 3 ~ 4장을 읽어 턴이 더 든다
    style_verifier: { max_budget_usd: 0.6, max_turns: 10, timeout_s: 420, allowed_tools: [Read], prompt_file: Tools/uigen/prompts/style_verifier.md, model: null }
    style_fix:      { max_budget_usd: 0.5, max_turns: 6, timeout_s: 300, allowed_tools: [Read], prompt_file: Tools/uigen/prompts/style_fix.md, model: null }
